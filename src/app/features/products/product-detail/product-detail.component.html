<div *ngIf="isLoading" class="text-center mt-5">
  <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
    <span class="visually-hidden">Загрузка...</span>
  </div>
  <p class="mt-3">Загружаем информацию о чае... 🍃</p>
</div>

<div *ngIf="errorMessage" class="alert alert-danger mt-5 text-center">
  <h4>❌ Ошибка</h4>
  <p>{{ errorMessage }}</p>
</div>

<div *ngIf="product && !isLoading" class="product-detail-wrapper">
  <div class="row align-items-start">

    <!-- Колонка с изображением -->
    <div class="col-md-6 mb-4 mb-md-0">
      <div class="product-image-container">
        <img [src]="product.image"
             class="product-image"
             [alt]="product.title"
             onerror="this.src='assets/images/tea-placeholder.png'">
      </div>
    </div>

    <!-- Колонка с информацией -->
    <div class="col-md-6">
      <h1 class="product-title">{{ product.title }}</h1>
      <p class="product-description">{{ product.description }}</p>
      <div class="priceAndAction">
        <div class="product-price">{{ product.price }} ₽</div>
        <button class="product-buy-btn" (click)="buyProduct()">
          Купить
        </button>
      </div>

    </div>

  </div>
</div>
