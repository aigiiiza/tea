<!-- Показываем спиннер загрузки -->
<div *ngIf="isLoading" class="text-center mt-5">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Загрузка...</span>
  </div>
  <p>Загрузка чайных коллекций...</p>
</div>

<!-- Показываем ошибку -->
<div *ngIf="errorMessage" class="alert alert-danger mt-5">
  {{ errorMessage }}
</div>

<!-- Показываем карточки товаров -->
<div *ngIf="!isLoading && !errorMessage" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
  <div class="col" *ngFor="let product of products">
    <div class="card h-100 border-1">
      <div class="ratio ratio-16x9">
        <img [src]="product.image || 'assets/images/tea-placeholder.png'"
             class="card-img-top object-fit-cover"
             [alt]="product.title">
      </div>
      <div class="card-body">
        <h5 class="card-title fw-bold">{{ product.title }}</h5>
        <p class="card-text">{{ product.description || 'Великолепный чай для настоящих ценителей' }}</p>
        <p class="card-text fw-bold text-primary">{{ product.price }} ₽</p>
        <a [routerLink]="['/product', product.id]" class="btn btn-outline-primary">
          Подробнее
        </a>
      </div>
    </div>
  </div>
</div>
